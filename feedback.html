<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GovOne Feedback</title><link rel="stylesheet" href="style.css"></head><body><main class="box"><h1>GovOne Feedback</h1><p>Help us improve the GovOne experience.</p><form id="feedback-form"><label>Name *<input name="name" required></label><label>Email *<input name="email" type="email" required></label><label>Feedback type<select name="type"><option>Suggestion</option><option>Issue report</option><option>Service experience</option><option>Accessibility</option></select></label><label>Message *<textarea name="message" required></textarea></label><button class="primary" type="submit">Submit</button></form><p id="feedback-success" class="success"></p><a class="back" href="index.html">← Back to GovOne</a></main><script>document.querySelector('#feedback-form').onsubmit=e=>{e.preventDefault();document.querySelector('#feedback-success').textContent='Your Message Has Been Recieved. Thank You.';e.currentTarget.reset();};</script></body></html>
